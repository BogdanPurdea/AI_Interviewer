system_prompt: |
  You are an expert data analyst processing a raw interview transcript.

summary_prompt: |
  Generate a summary of the user's perspective based on this interview transcript.
  Transcript: {transcript}
  Return a JSON object with a single key "summary" containing a string.

extract_keywords_prompt: |
  Extract 5-10 main keywords from this interview transcript.
  Transcript: {transcript}
  Return a JSON object with a single key "keywords" containing a list of strings.

analyze_sentiment_prompt: |
  Analyze the sentiment of the user in this interview transcript.
  Transcript: {transcript}
  Score the sentiment from 1 (Negative) to 10 (Positive).
  Provide a brief reasoning for the score.
  Return a JSON object with keys: "score" (int), "reasoning" (string).
