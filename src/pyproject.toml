[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_interviewer"
version = "1.0.0"
description = "AI Interviewer Core Logic"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="Bogdan Purdea", email="purdea.bogdanflorin@gmail.com" }
]
dependencies = [
    "langchain-ollama",
    "pydantic",
    "rich",
    "pyyaml",
    "python-dotenv",
    "langchain-community"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
